name: Publish NuGet packages

# Manual only — never runs on push/PR. Publishing to nuget.org isn't reversible, so nothing here
# happens without someone explicitly clicking "Run workflow" (Actions tab -> Publish NuGet
# packages -> Run workflow).
"on":
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish (e.g. 2.1.0). Leave empty to publish whatever version is
          already set in src/Directory.Build.props.
        required: false
        type: string
      dry_run:
        description: "Pack and upload as a workflow artifact, but don't push to nuget.org."
        required: false
        type: boolean
        default: false
      action:
        description: >-
          publish: build, pack and push the packages. unlist: hide earlier versions on nuget.org
          (nothing is built or pushed).
        required: false
        type: choice
        options:
          - publish
          - unlist
        default: publish
      package_ids:
        description: >-
          unlist only: package IDs to unlist, comma-separated. Leave empty for every package in
          this repo. Packages owned by another nuget.org account need NUGET_UNLIST_API_KEY.
        required: false
        type: string
        default: ""
      keep_version:
        description: >-
          unlist only: the version to keep listed (e.g. 3.0.0). Leave empty to keep the newest
          listed version of each package. Use "none" to unlist every version.
        required: false
        type: string
        default: ""

jobs:
  publish:
    if: ${{ inputs.action != 'unlist' }}
    runs-on: ubuntu-latest
    # Optional extra gate: create a "release" environment under repo Settings -> Environments and
    # add required reviewers there to force manual approval before every publish. Harmless to leave
    # as-is if you don't set that up — GitHub just creates an unprotected environment on first run.
    # If you do configure nuget.org's Trusted Publishing policy with an Environment value (below),
    # it must match this name.
    environment: release
    # Declaring ANY permission here resets every unlisted scope to "none" (GitHub Actions doesn't
    # merge this with the repo/org default) — contents: read must be listed explicitly or
    # actions/checkout gets a token with no read access at all, which on a private repo surfaces
    # as "Repository not found" rather than a permissions error.
    permissions:
      contents: read
      id-token: write # required to request the GitHub OIDC token Trusted Publishing exchanges for a NuGet API key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      # The dashboard's SPA (src/PowerTraces.Dashboard/wwwroot) is committed as a built artifact so a
      # plain `dotnet build` doesn't need Node — but a publish should always embed a freshly built
      # copy of what's actually in ClientWeb/src, not whatever happened to be committed last.
      - name: Build dashboard frontend
        working-directory: src/PowerTraces.Dashboard/ClientWeb
        run: |
          yarn install --immutable
          yarn build

      - name: Set package version
        if: ${{ inputs.version != '' }}
        run: |
          sed -i "s#<Version>[^<]*</Version>#<Version>${{ inputs.version }}</Version>#" src/Directory.Build.props
          grep '<Version>' src/Directory.Build.props

      - name: Restore
        run: dotnet restore PowerTraces.sln

      - name: Build (Release)
        run: dotnet build PowerTraces.sln -c Release --no-restore

      - name: Pack
        run: dotnet pack PowerTraces.sln -c Release --no-build --output nupkgs

      - name: List packed packages
        run: ls -la nupkgs/

      - name: Upload packages as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
          if-no-files-found: error

      # Trusted Publishing (OIDC) — no long-lived NuGet API key stored anywhere in this repo. One
      # short-lived key (valid ~1 hour, single use) is issued per run instead. Requires a policy
      # configured on nuget.org FIRST: sign in -> your username -> Trusted Publishing -> add a
      # policy with Repository Owner/Repository set to this repo and Workflow File set to
      # "publish.yml" (filename only, not the full path). A freshly created policy on a private
      # repo starts in a 7-day "pending full activation" window that a successful publish makes
      # permanent — see https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing.
      # `NUGET_USER` is your nuget.org username (profile name, NOT your email) — store it as a
      # repository secret even though it isn't sensitive, so it isn't hardcoded here.
      - name: NuGet login (OIDC -> short-lived API key)
        if: ${{ inputs.dry_run != true }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: ${{ inputs.dry_run != true }}
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  unlist:
    if: ${{ inputs.action == 'unlist' }}
    runs-on: ubuntu-latest
    # Same environment and workflow file as publishing, so the same nuget.org Trusted Publishing
    # policy issues the key; that policy needs the "Unlist or relist package versions" scope.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Find versions to unlist
        env:
          PACKAGE_IDS: ${{ inputs.package_ids }}
          KEEP_VERSION: ${{ inputs.keep_version }}
        run: |
          python3 - <<'EOF' > unlist.txt
          import glob, gzip, json, os, re, urllib.error, urllib.request

          def get(url):
              request = urllib.request.Request(url, headers={"Accept-Encoding": "gzip"})
              with urllib.request.urlopen(request) as response:
                  body = response.read()
                  return json.loads(gzip.decompress(body) if response.headers.get("Content-Encoding") == "gzip" else body)

          def listed(package_id):
              try:
                  index = get(f"https://api.nuget.org/v3/registration5-gz-semver2/{package_id.lower()}/index.json")
              except urllib.error.HTTPError:
                  return []
              versions = []
              for page in index["items"]:
                  for item in page.get("items") or get(page["@id"])["items"]:
                      entry = item["catalogEntry"]
                      if entry.get("listed", True):
                          versions.append(entry["version"])
              return versions

          ids = [i.strip() for i in os.environ.get("PACKAGE_IDS", "").split(",") if i.strip()]
          if not ids:
              ids = sorted({m for path in glob.glob("src/*/*.csproj") for m in re.findall(r"<PackageId>([^<]+)</PackageId>", open(path).read())})
          keep = os.environ.get("KEEP_VERSION", "").strip()
          for package_id in ids:
              versions = listed(package_id)
              kept = None if keep.lower() == "none" else (keep if keep else (versions[-1] if versions else None))
              for version in versions:
                  if kept is None or version.lower() != kept.lower():
                      print(package_id, version)
          EOF
          {
            echo "### Versions to unlist"
            if [ -s unlist.txt ]; then echo '```'; cat unlist.txt; echo '```'; else echo "Nothing listed to unlist."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat unlist.txt

      - name: NuGet login (OIDC -> short-lived API key)
        if: ${{ inputs.dry_run != true }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Packages owned by another nuget.org account (such as the old Acumency ones) aren't covered
      # by this repo's policy: store an API key from that account, with the "Unlist package" scope,
      # as NUGET_UNLIST_API_KEY and it's used instead.
      - name: Unlist
        if: ${{ inputs.dry_run != true }}
        env:
          API_KEY: ${{ secrets.NUGET_UNLIST_API_KEY || steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          failed=0
          while read -r id version; do
            [ -z "$id" ] && continue
            if dotnet nuget delete "$id" "$version" --source https://api.nuget.org/v3/index.json --api-key "$API_KEY" --non-interactive > out.log 2>&1; then
              echo "Unlisted $id $version"
            else
              failed=$((failed + 1))
              echo "::warning::Couldn't unlist $id $version: $(grep -o '[0-9]\{3\} ([^)]*)' out.log | head -1)"
            fi
          done < unlist.txt
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed version(s) couldn't be unlisted. A 403 means the key can't manage that package: it belongs to another nuget.org account, so add that account's API key with the Unlist package scope as NUGET_UNLIST_API_KEY."
            exit 1
          fi
